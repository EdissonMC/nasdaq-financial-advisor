services:
  sentiment_api:
    build: .
    container_name: sentiment_api
    ports:
      - "8000:8000"
    environment:
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - LOGGING_DB_PATH=/data/interactions.db
    volumes:
      - ./data:/data  # persists the sqlite database file outside the container
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
